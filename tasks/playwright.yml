#file: noinspection YAMLSchemaValidation
version: '3'
vars:
  DOCROOT:
    sh: node -e "try { const c = require('./composer.json'); const w = (c.extra?.['drupal-scaffold']?.locations?.['web-root'] || 'web').replace(/\/$/, ''); process.stdout.write(w); } catch(e) { process.stdout.write('web'); }"

  # Wrapper that serialises Playwright runs across every DDEV project on the
  # machine. It is a no-op unless PLAYWRIGHT_MUTEX=1 is set, so wiring it in
  # here changes nothing by default. See bin/playwright-mutex and the
  # "Running Tests Concurrently" documentation.
  #
  # Falls back to `env`, which runs its arguments unchanged, so a project that
  # vendors this Taskfile somewhere unexpected still runs its tests.
  MUTEX:
    sh: |
      for candidate in \
        "{{ .TASKFILE_DIR }}/../bin/playwright-mutex" \
        "test/playwright/node_modules/@lullabot/playwright-drupal/bin/playwright-mutex" \
        "node_modules/@lullabot/playwright-drupal/bin/playwright-mutex"; do
        if [ -x "$candidate" ]; then
          printf '%s' "$candidate"
          exit 0
        fi
      done
      printf 'env'
tasks:
  run:
    desc: "Runs playwright functional tests."
    summary: |
      Runs Playwright tests.
        - shard=x/y: Run a fraction of tests. Optional.

      Arguments after `--` are forwarded to `playwright test`:

        task playwright:run -- --grep @smoke

      Note that they are forwarded as a single string and re-split on spaces,
      so a pattern containing a space needs to avoid one: prefer
      `--grep 'Front.page'` over `--grep 'Front page'`.

      With PLAYWRIGHT_MUTEX=1 set, only one run happens at a time across the
      whole machine. See "Running Tests Concurrently" in the documentation.
    cmds:
      # The body is a separate task because the lock has to span both
      # playwright:install and the run itself, and a Taskfile cmd is one shell.
      - '{{ .MUTEX }} task -x playwright:run:locked shard={{ default "1/1" .shard }} -- {{ .CLI_ARGS }}'

  # Deliberately has no desc: it is an implementation detail of playwright:run
  # and stays out of `task --list`. It cannot be marked `internal`, because the
  # mutex shells back out to `task` and that counts as a CLI invocation.
  run:locked:
    cmds:
      - task: install
      - |
        cd test/playwright
        npx playwright test --shard={{ default "1/1" .shard }} {{ .CLI_ARGS }}
        STATUS=$?
        echo "System uptime and load average statistics:"; uptime
        echo "If the load average is significantly different than **$(cat /proc/cpuinfo | grep processor | wc -l)** there may be too many or two few Playwright workers assigned. You might want to tweak the number of workers or shards."
        exit $STATUS

  install:
    desc: "Install a base copy of the site for testing."
    summary: |
      This installs Drupal using sqlite. This allows for each test case to
      start with a fixed installation state, with significantly improved
      performance compared to mariadb / mysql. This command should be run
      any time configuration has changed that would change the installed site
      state.
    cmds:
      - |
        # This environment variable tells Drupal to alter the database settings
        # in settings.php.
        export PLAYWRIGHT_SETUP=1
        set +e
        task --dry playwright:install:hook 2>/dev/null 1>/dev/null
        if [[ $? -eq 200 ]]; then
          echo "Task playwright:install:hook does not exist. Running drush site:install --yes demo_umami..."
          drush site:install --yes --site-name Playwright demo_umami
        else
          task playwright:install:hook
        fi

  mysql-to-sqlite:
    desc: "Convert the active MySQL/MariaDB database to SQLite for Playwright tests"
    cmds:
      - mkdir -p /tmp/sqlite
      - >-
        uv tool run
        --from 'mysql-to-sqlite3==2.6.0'
        mysql2sqlite
        --mysql-host db
        --mysql-port 3306
        --mysql-user db
        --mysql-password db
        --mysql-database db
        --sqlite-file /tmp/sqlite/.ht.sqlite

  prepare:
    desc: "Copy a database in preparation for a test run."
    summary: |
      This copies a database created with playwright:install to a now location.

      task playwright:prepare test_id=456

      will import the database into `<DOCROOT>/sites/simpletest/456/.ht.sqlite`
      where DOCROOT is read from composer.json (defaults to `web`).
    preconditions:
      - sh: test -f /tmp/sqlite/.ht.sqlite
        msg: 'playwright:install needs to be run before tests can run.'
    cmds:
      - |
        export PLAYWRIGHT_SETUP=1

        # Recreate the sites directory.
        rm -rf "{{ .DOCROOT }}/sites/simpletest/{{ shellQuote .test_id }}/"
        mkdir -p "{{ .DOCROOT }}/sites/simpletest/{{ shellQuote .test_id }}/"
        mkdir -p /tmp/sqlite/{{ shellQuote .test_id }}/

        # On locals, copying in only the files we need (and not all assets
        # downloaded via stage file proxy) saves several seconds.

        # Copy in settings.php and our services files.
        cp -a "{{ .DOCROOT }}/sites/default/"*.php "{{ .DOCROOT }}/sites/simpletest/{{ shellQuote .test_id }}/"
        cp -a "{{ .DOCROOT }}/sites/default/"*.yml "{{ .DOCROOT }}/sites/simpletest/{{ shellQuote .test_id }}/"

        # Copy the database while holding an exclusive lock. Multiple test
        # workers run prepare concurrently, and drush bootstrap writes to
        # the base database (cache tables). Without serialization, a cp
        # during a concurrent drush write can copy a partially-written
        # WAL, resulting in missing tables like cache_bootstrap.
        flock /tmp/sqlite/.lock cp -a /tmp/sqlite/.ht.sqlite /tmp/sqlite/{{ shellQuote .test_id }}/

        # Get a user agent based on the test ID. We need to convert colons to
        # URL-escaped characters. Hold the same lock since drush bootstrap
        # writes to the base database.
        UA=$(flock /tmp/sqlite/.lock drush ev 'echo drupal_generate_test_ua("test{{ shellQuote .test_id }}");' | sed 's/:/%3A/g')

        # Make sure we can load a page before running any tests.
        # These steps are slow, adding a second or more to each test preparation
        # step. However, these steps would also be run on a first page load by a
        # test, so we may as well add this early check to make sure the test
        # site is working.
        curl -s -k -b SIMPLETEST_USER_AGENT=$UA $DDEV_PRIMARY_URL/core/rebuild.php > /dev/null
        STATUS=$(curl -s -k -b SIMPLETEST_USER_AGENT=$UA -w "%{http_code}\n" -o /dev/null $DDEV_PRIMARY_URL)
        if [[ $STATUS != "200" ]]; then
          (echo "The test site {{ shellQuote .test_id }} is not working as it returned HTTP status $STATUS.";
          echo "Likely your code changes are causing an exception to be thrown.";
          echo "Test by reinstalling the base site and ensuring the home page loads.";) >&2
          exit 1
        fi

        set +e
        task --dry playwright:prepare:hook 2>/dev/null 1>/dev/null
        if [[ $? -ne 200 ]]; then
          set -e
          task playwright:prepare:hook test_id={{ shellQuote .test_id }}
        fi

  ua:
    desc: Return the cookie value for a given test ID.
    summary: |
      Playwright tests need to know the cookie value to use to tell Drupal to
      use a specific test prefix. It turns out this is a single global function
      function, so we haven't gone to the trouble of writing a full Drush
      command for it.

      This command will only ever output the direct cookie value unless there
      is an error. The cookie value will have colons replaced with %3A.
    cmds:
      - PLAYWRIGHT_SETUP=1 drush ev 'echo drupal_generate_test_ua("test{{ shellQuote .test_id }}");' | sed 's/:/%3A/g'

  cleanup:
    desc: Clean up after a test run.
    summary: |
      Deletes databases and simpletest/* files directories after a test successfully completes.
    cmds:
      - |
        # Delete the files and settings directories.
        # Fast tests that do not require a full page render may finish before Drupal
        # has fully written files like aggregated JavaScript to disk.
        while [ -d "{{ .DOCROOT }}/sites/simpletest/{{ shellQuote .test_id }}/" ]; do
          rm -rf "{{ .DOCROOT }}/sites/simpletest/{{ shellQuote .test_id }}/" 2>/dev/null || true
        done;

        # Delete the database.
        rm -rf /tmp/sqlite/{{ shellQuote .test_id }}/

        set +e
        task --dry playwright:cleanup:hook test_id={{ shellQuote .test_id }} 2>/dev/null 1>/dev/null
        # 200 is the exit code when a task doesn't exist.
        if [[ $? -ne 200 ]]; then
          set -e
          task playwright:cleanup:hook test_id={{ shellQuote .test_id }}
        fi;

  visualdiff:
    desc: Runs only visual diff tests
    summary: |
      Runs only the tests that have a -snapshots directory next to them.

      Arguments after `--` are forwarded to `playwright test`:

        task playwright:visualdiff -- --project chromium

      They are forwarded as a single string and re-split on spaces, so a
      pattern containing a space needs to avoid one: prefer
      `--grep 'Front.page'` over `--grep 'Front page'`.

      With PLAYWRIGHT_MUTEX=1 set, only one run happens at a time across the
      whole machine. See "Running Tests Concurrently" in the documentation.
    cmds:
      # See the note on playwright:run for why the body is a separate task.
      - '{{ .MUTEX }} task -x playwright:visualdiff:locked -- {{ .CLI_ARGS }}'

  visualdiff:locked:
    cmds:
      - task: install
      - |
        cd test/playwright

        # First capture all tests that have snapshots.
        TESTS=$(find . -name '*-snapshots' -type d | sed 's/-snapshots//' | sed 's/\.\///')

        # Bail rather than run everything. `xargs` with an empty list still
        # executes the command, and `playwright test` with no file filter runs
        # the entire suite -- a green result that tested far more than asked.
        if [ -z "$TESTS" ]; then
          echo "No *-snapshots directories found under test/playwright." >&2
          echo "Nothing was run. Run the test once so Playwright writes its first" >&2
          echo "snapshot, which is what creates the directory this looks for." >&2
          exit 1
        fi

        # Run just tests with snapshots.
        echo $TESTS | xargs npx playwright test {{ .CLI_ARGS }}

  regenerate:
    desc: Regenerates all Playwright snapshots, deleting existing ones by default
    summary: |
      This task deletes all files listed in the -snapshots directories in each
      Playwright test. Then, it reruns tests with the --update-snapshots
      argument.
        - delete=<0,1>: Set to 0 to not delete existing snapshots. Useful
                        when snapshot filenames should not change. Optional,
                        and defaults to 1 only when no filter is given.

      Arguments after `--` are forwarded to `playwright test`, and require an
      explicit `delete` because deleting every snapshot before regenerating a
      filtered subset would leave the rest missing.

      They are forwarded as a single string and re-split on spaces, so a
      pattern containing a space needs to avoid one: prefer
      `--grep 'Front.page'` over `--grep 'Front page'`.

      With PLAYWRIGHT_MUTEX=1 set, only one run happens at a time across the
      whole machine. See "Running Tests Concurrently" in the documentation.

      Examples:
        Do not delete snapshots when regenerating.
        - task playwright:regenerate delete=0

        Regenerate only one test's snapshots, keeping the rest.
        - task playwright:regenerate delete=0 -- --grep 'Front.page'
    cmds:
      # See the note on playwright:run for why the body is a separate task.
      # Both `delete` and the trailing arguments have to cross the nested task
      # call: a nested `task` process starts with an empty CLI_ARGS, so
      # dropping either silently changes what this destroys.
      - '{{ .MUTEX }} task -x playwright:regenerate:locked delete={{ .delete }} -- {{ .CLI_ARGS }}'

  regenerate:locked:
    cmds:
      - task: install
      - |
        cd test/playwright
        # First capture all tests that have snapshots.
        TESTS=$(find . -name '*-snapshots' -type d | sed 's/-snapshots//' | sed 's/\.\///')

        if [ -z "$TESTS" ]; then
          echo "No *-snapshots directories found under test/playwright." >&2
          echo "Nothing was run. Create the directory for a test before regenerating," >&2
          echo "or run the test once so Playwright writes its first snapshot." >&2
          exit 1
        fi

        DELETE='{{ .delete }}'
        ARGS='{{ .CLI_ARGS }}'

        # Deleting every snapshot and then regenerating a filtered subset
        # leaves the rest missing, which looks like a regeneration that worked
        # until the next full run. Make the caller say which they meant.
        if [ -z "$DELETE" ]; then
          if [ -n "$ARGS" ]; then
            echo "Refusing to delete every snapshot for a filtered regeneration." >&2
            echo "Pass delete=0 to keep the snapshots you are not regenerating," >&2
            echo "or delete=1 if wiping all of them really is what you want." >&2
            exit 1
          fi
          DELETE=1
        fi

        # Remove snapshot files, but keep the directories. That way if tests
        # fail and this is rerun, we know what tests should have snapshots.
        if [ "$DELETE" = "1" ]; then
          find . -name '*-snapshots' -type d | xargs -I {} -n1 /bin/sh -c 'rm -rf {}/*'
        fi

        # Run just tests with snapshots.
        echo $TESTS | xargs npx playwright test --update-snapshots --retries 3 $ARGS
        echo "From your host, run the following from the project directory to add all changes to commit."
        echo "Be sure to review for unexpected changes, and don't be surprised if modified tests cause"
        echo "files to be renamed."
        echo ""
        echo "find test/playwright -name '*-snapshots' -type d | xargs git add -A"
        echo ""
        echo "Some images may show minor variations, especially with the position of Drupal's admin"
        echo "toolbar. Typically those variations are handled automatically by Playwright's retry"
        echo "settings. Consider reverting those changes to avoid extra repository growth."

