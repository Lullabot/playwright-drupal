name: Token Permission Probe

# Temporary. Finds out what permissions the undocumented attachments endpoint
# actually requires of SCREENSHOT_GITHUB_TOKEN, which cannot be read off the
# API: the endpoint does not return the X-Accepted-GitHub-Permissions header
# that documented endpoints use to advertise their requirements.
#
# Delete this once the answer is recorded in the docs.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/token-permission-probe.yml

permissions:
  contents: read

jobs:
  probe:
    name: Probe token permissions
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Attempt one upload
        env:
          SCREENSHOT_GITHUB_TOKEN: ${{ secrets.SCREENSHOT_GITHUB_TOKEN }}
        run: |
          set -uo pipefail

          if [ -z "${SCREENSHOT_GITHUB_TOKEN}" ]; then
            echo 'SCREENSHOT_GITHUB_TOKEN is not set — nothing to probe.'
            exit 1
          fi

          echo "GITHUB_REPOSITORY_ID is '${GITHUB_REPOSITORY_ID}'"

          # A 1x1 PNG. The bytes do not matter; only the response does.
          base64 -d > probe.png <<'PNG'
          iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==
          PNG

          status=$(curl -sS -o response.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${SCREENSHOT_GITHUB_TOKEN}" \
            -H 'Accept: application/json' \
            -H 'Content-Type: image/png' \
            --data-binary '@probe.png' \
            "https://uploads.github.com/user-attachments/assets?name=token-probe.png&content_type=image/png&repository_id=${GITHUB_REPOSITORY_ID}") || status='000'

          echo "HTTP ${status}"
          echo 'Response body:'
          cat response.json
          echo

          {
            echo '## Token permission probe'
            echo
            echo "- Repository ID seen by the runner: \`${GITHUB_REPOSITORY_ID:-unset}\`"
            echo "- Upload status: \`${status}\`"
            echo '- Response body:'
            echo
            echo '```json'
            head -c 500 response.json
            echo
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
