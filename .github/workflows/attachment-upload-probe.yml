name: Attachment Upload Probe

# Probes the undocumented https://uploads.github.com/user-attachments/assets
# endpoint — the programmatic equivalent of dragging an image into a comment —
# to find out which of our tokens (if any) is allowed to use it. If it works,
# test screenshots and visual diffs can be embedded directly in PR comments
# instead of being buried in a zipped artifact.
#
# Results land in the job summary either way; a comment is only posted when at
# least one upload succeeds.
#
# Findings so far:
#   - A user PAT works: HTTP 201 with {"url": "https://github.com/user-attachments/assets/<uuid>"}.
#   - The Actions GITHUB_TOKEN gets HTTP 404 {"message":"Not Found"}, which is
#     how GitHub denies an endpoint you are not allowed to see.
#   - A GitHub App installation token gets the same 404, so it is the token
#     class that is rejected, not the specific token.
# Set an ATTACHMENT_UPLOAD_PAT secret to confirm a PAT works from CI too.

on:
  pull_request:
    paths:
      - .github/workflows/attachment-upload-probe.yml
      - .github/scripts/make-probe-image.mjs
  workflow_dispatch:
    inputs:
      pr-number:
        description: 'Pull request to comment on. Leave blank for a job summary only.'
        required: false
        type: string

permissions:
  contents: read
  pull-requests: write

jobs:
  probe:
    name: Probe attachment upload
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate probe image
        run: node .github/scripts/make-probe-image.mjs probe.png "${{ github.run_id }}"

      - name: Upload attachment with each token
        id: upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TOKEN_ACTIONS: ${{ secrets.GITHUB_TOKEN }}
          TOKEN_PAT: ${{ secrets.ATTACHMENT_UPLOAD_PAT }}
        run: |
          set -uo pipefail

          REPO_ID=$(gh api "repos/${GITHUB_REPOSITORY}" --jq .id)
          echo "Repository ID: ${REPO_ID}"

          : > results.md
          : > images.md
          SUCCEEDED=0

          probe() {
            label="$1"
            slug="$2"
            token="$3"
            # The endpoint is undocumented, so try both auth schemes rather than
            # concluding anything from a header format quirk.
            scheme="${4:-Bearer}"

            if [ -z "${token}" ]; then
              printf '| %s | — | not configured, skipped |\n' "${label}" >> results.md
              return
            fi

            status=$(curl -sS -o response.json -w '%{http_code}' \
              -X POST \
              -H "Authorization: ${scheme} ${token}" \
              -H 'Accept: application/json' \
              --data-binary '@probe.png' \
              "https://uploads.github.com/user-attachments/assets?name=probe-${slug}.png&content_type=image/png&repository_id=${REPO_ID}") || status='000'

            href=$(jq -r '.href // .url // .asset.href // empty' response.json 2>/dev/null)

            echo "::group::${label} (HTTP ${status})"
            head -c 2000 response.json
            echo
            echo '::endgroup::'

            if [ -n "${href}" ]; then
              printf '| %s | %s | uploaded ✅ |\n' "${label}" "${status}" >> results.md
              printf '**Uploaded with %s**\n\n<img src="%s" alt="probe image uploaded with %s" width="480">\n\n' \
                "${label}" "${href}" "${label}" >> images.md
              SUCCEEDED=1
            else
              # Keep the failure body short; it is usually a one-line JSON error.
              body=$(tr -d '\n' < response.json | head -c 200)
              printf '| %s | %s | failed ❌ `%s` |\n' "${label}" "${status}" "${body:-no body}" >> results.md
            fi
          }

          probe 'GITHUB_TOKEN, Bearer' 'actions-bearer' "${TOKEN_ACTIONS}" 'Bearer'
          probe 'GITHUB_TOKEN, token scheme' 'actions-token' "${TOKEN_ACTIONS}" 'token'
          probe 'PAT (ATTACHMENT_UPLOAD_PAT)' 'pat' "${TOKEN_PAT}" 'Bearer'

          {
            echo '## Attachment upload probe'
            echo
            echo '| Token | HTTP | Result |'
            echo '| --- | --- | --- |'
            cat results.md
          } >> "${GITHUB_STEP_SUMMARY}"

          echo "any-success=${SUCCEEDED}" >> "${GITHUB_OUTPUT}"

      # Always comment, even when nothing uploaded: whether GITHUB_TOKEN can
      # post a comment at all is a separate question from whether it can upload
      # an attachment, and this is the step that answers it.
      - name: Comment on the pull request
        id: comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr-number }}
        run: |
          set -uo pipefail

          if [ -z "${PR_NUMBER}" ]; then
            echo 'No pull request to comment on — job summary only.'
            exit 0
          fi

          {
            echo '### Attachment upload probe'
            echo
            echo "Run [\`${GITHUB_RUN_ID}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) tried \`uploads.github.com/user-attachments/assets\` with each token available to it."
            echo
            if [ -s images.md ]; then
              cat images.md
            else
              echo 'No token managed to upload, so there is no image to embed here.'
              echo
            fi
            echo '| Token | HTTP | Result |'
            echo '| --- | --- | --- |'
            cat results.md
            echo
            echo 'This comment itself was posted with `GITHUB_TOKEN`.'
          } > comment.md

          gh pr comment "${PR_NUMBER}" --body-file comment.md
