name: Test

on:
  pull_request:
  workflow_call:

jobs:
  unit-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        typescript-version: ['5', '6']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Install TypeScript ${{ matrix.typescript-version }}
        run: npm install --no-save typescript@${{ matrix.typescript-version }}

      - name: Run unit tests
        run: npm run test:unit

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        typescript-version: ['5', '6']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Install TypeScript ${{ matrix.typescript-version }}
        run: npm install --no-save typescript@${{ matrix.typescript-version }}

      - name: Pack
        run: npm pack

      - name: Upload tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-drupal-tarball-ts${{ matrix.typescript-version }}
          path: lullabot-playwright-drupal-*.tgz
          retention-days: 1

  shell-test:
    # bin/playwright-mutex needs neither DDEV nor Docker, so it does not belong
    # behind the fifteen-minute integration matrix below.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats

      - name: Run shell tests
        run: bats test/mutex.bats

  test:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite:
          - integration
          - integration-docroot
          - integration-mysql-to-sqlite
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats

      - name: Install DDEV
        uses: ddev/github-action-setup-ddev@fdf2f5c97943bae638f31df6df86f1defa6210c0 # v1.12.1
        with:
          autostart: false

      - name: Download tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: playwright-drupal-tarball-ts6

      - name: Set tarball path
        run: echo "PLAYWRIGHT_DRUPAL_TARBALL=$(ls "$GITHUB_WORKSPACE"/lullabot-playwright-drupal-*.tgz)" >> "$GITHUB_ENV"

      - name: Run integration tests
        run: bats test/${{ matrix.suite }}.bats

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ matrix.suite }}
          path: /tmp/pwtest-*/test/playwright/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Accessibility summary
        if: always()
        run: |
          npm install && npm run build
          # Prefer the a11y-specific report preserved outside test-results/.
          REPORT=$(find tmp/ -path "*/test/playwright/a11y-results.json" 2>/dev/null | head -1)
          # Fall back to the generic report.
          REPORT=${REPORT:-$(find tmp/ -path "*/test/playwright/test-results/results.json" 2>/dev/null | head -1)}
          if [ -n "$REPORT" ]; then
            node lib/github/a11y-summary.js --mode=summary --report-path="$REPORT"
            node lib/github/a11y-summary.js --mode=annotations --report-path="$REPORT"
          else
            echo "No JSON report found — skipping a11y summary."
          fi

      # The report lives under a generated directory, so find it before handing
      # it over. Everything after that is the shipped action, which keeps this
      # repository honest about what consumers get.
      - name: Locate the Playwright report
        if: always()
        run: |
          REPORT=$(find tmp/ -path "*/test/playwright/test-results/results.json" 2>/dev/null | head -1)
          echo "PLAYWRIGHT_REPORT=${REPORT}" >> "${GITHUB_ENV}"
          # The action needs a built checkout to run the working tree rather
          # than the last release.
          [ -f lib/github/failure-summary.js ] || { npm install && npm run build; }

      # Without SCREENSHOT_GITHUB_TOKEN — as on pull requests from forks, which
      # never receive it — this still writes the summary, just without images.
      - name: Failure summary
        if: always() && env.PLAYWRIGHT_REPORT != ''
        uses: ./.github/actions/failure-summary
        with:
          report-path: ${{ env.PLAYWRIGHT_REPORT }}
          token: ${{ secrets.SCREENSHOT_GITHUB_TOKEN }}
          comment-path: failure-comment-${{ matrix.suite }}.md
          artifact-name: failure-comment-${{ matrix.suite }}
          title: Playwright results — ${{ matrix.suite }}
          package: .

  # One comment for the whole run. Posting from each matrix job instead would
  # have them overwrite each other, and none of them could say how the other
  # suites did.
  failure-comment:
    needs: test
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: write
      # download-artifact reads the run's artifacts through the Actions API,
      # and a job-level permissions block denies everything it does not list.
      actions: read
      contents: read
    steps:
      # A local action needs the repository on disk before it can be used.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Comment on the pull request
        uses: ./.github/actions/failure-comment

