name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  # Both feature PRs and release PRs run test.yml before merging. Keep release
  # automation off that suite's critical path instead of testing each merge again.
  release-please:
    runs-on: ubuntu-26.04
    outputs:
      drupal_release_created: ${{ steps.release.outputs.release_created }}
      testing_release_created: ${{ steps.release.outputs['packages/playwright-testing--release_created'] }}
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_PRIVATE_KEY }}
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}

  publish-drupal:
    needs: release-please
    if: needs.release-please.outputs.drupal_release_created == 'true'
    runs-on: ubuntu-26.04
    environment: release-please
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm install

      - name: Publish to npm
        run: npm publish --access public

  publish-testing:
    needs: release-please
    if: needs.release-please.outputs.testing_release_created == 'true'
    runs-on: ubuntu-26.04
    environment: release-please
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm install

      - name: Publish to npm
        working-directory: packages/playwright-testing
        run: npm publish --access public
