name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write
  # A called workflow cannot request more than its caller was granted, and an
  # explicit block here denies everything it does not list. test.yml's
  # failure-comment job asks for actions: read, so without this the whole run
  # is rejected before any job starts and release-please never executes.
  actions: read

jobs:
  release-please:
    needs: test
    runs-on: ubuntu-24.04
    outputs:
      drupal_release_created: ${{ steps.release.outputs.release_created }}
      testing_release_created: ${{ steps.release.outputs['packages/playwright-testing--release_created'] }}
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_PRIVATE_KEY }}
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}

  test:
    uses: ./.github/workflows/test.yml

  publish-drupal:
    needs: release-please
    if: needs.release-please.outputs.drupal_release_created == 'true'
    runs-on: ubuntu-24.04
    environment: release-please
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm install

      - name: Publish to npm
        run: npm publish --access public

  publish-testing:
    needs: release-please
    if: needs.release-please.outputs.testing_release_created == 'true'
    runs-on: ubuntu-24.04
    environment: release-please
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm install

      - name: Publish to npm
        working-directory: packages/playwright-testing
        run: npm publish --access public
