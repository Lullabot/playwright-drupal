name: Playwright failure and flake summary
description: >-
  Write a job summary of Playwright failures and flakes, and optionally a body
  for a sticky pull request comment with screenshots when an upload token is
  available.

inputs:
  report-path:
    description: Playwright JSON report to read.
    required: true
  token:
    description: >-
      A user personal access token permitted to upload attachments. Leave it
      unset — as it will be on pull requests from forks — to get the same
      summary without images.
    required: false
    default: ''
  comment-path:
    description: Where to write the comment body. Leave unset to skip it.
    required: false
    default: ''
  artifact-name:
    description: >-
      Upload the comment body under this artifact name, for a later job to
      assemble. Leave unset to skip the upload.
    required: false
    default: ''
  title:
    description: Heading for the comment.
    required: false
    default: Playwright results
  include:
    description: >-
      `diff` uploads only the diff image for a failed comparison; `all` adds the
      expected and actual images. Accessibility screenshots are included either
      way.
    required: false
    default: diff
  max-uploads:
    description: Stop uploading after this many images.
    required: false
    default: '20'
  path-prefix:
    description: >-
      `FROM:TO` mapping for the attachment paths in the report, for when
      Playwright ran somewhere this step cannot reach — mapping
      `/var/www/html` onto the checkout, for a DDEV project. Normally
      unnecessary: the mapping is worked out by locating the recorded files
      around the report, and confirmed against the disk before it is used. Set
      it when that cannot work, such as a report moved away from the files it
      describes.
    required: false
    default: ''
  package:
    description: >-
      Package to run the command from, resolved with npx — so a name, a version
      spec, or a tarball all work. Pass the path of a checkout that has already
      been built (`.`) to run that build directly instead of installing it.
    required: false
    default: '@lullabot/playwright-drupal'

runs:
  using: composite
  steps:
    - name: Write the failure and flake summary
      shell: bash
      env:
        SCREENSHOT_GITHUB_TOKEN: ${{ inputs.token }}
        REPORT_PATH: ${{ inputs.report-path }}
        COMMENT_PATH: ${{ inputs.comment-path }}
        TITLE: ${{ inputs.title }}
        INCLUDE: ${{ inputs.include }}
        MAX_UPLOADS: ${{ inputs.max-uploads }}
        PATH_PREFIX: ${{ inputs.path-prefix }}
        PACKAGE: ${{ inputs.package }}
      run: |
        # A missing report is not a failure: the suite may not have run.
        if [ ! -f "${REPORT_PATH}" ]; then
          echo "No Playwright report at ${REPORT_PATH} — skipping the failure summary."
          exit 0
        fi

        args=(
          "--report-path=${REPORT_PATH}"
          "--include=${INCLUDE}"
          "--max-uploads=${MAX_UPLOADS}"
          "--title=${TITLE}"
        )
        if [ -n "${COMMENT_PATH}" ]; then
          args+=("--comment-path=${COMMENT_PATH}")
        fi
        if [ -n "${PATH_PREFIX}" ]; then
          args+=("--path-prefix=${PATH_PREFIX}")
        fi

        # A checkout that has already been built can be run as it stands, which
        # keeps this repository's own CI testing the working tree rather than
        # the last release.
        if [ -f "${PACKAGE}/lib/github/failure-summary.js" ]; then
          node "${PACKAGE}/lib/github/failure-summary.js" "${args[@]}"
        else
          npx -y -p "${PACKAGE}" playwright-drupal-failure-summary "${args[@]}"
        fi

    - name: Upload the comment body
      if: inputs.artifact-name != '' && inputs.comment-path != ''
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.comment-path }}
        retention-days: 1
        if-no-files-found: ignore
